repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v3.2.0
    hooks:
    -   id: trailing-whitespace
    -   id: end-of-file-fixer
    -   id: check-yaml
    -   id: check-toml
-   repo: local
    hooks:
    -   id: cargo-fmt
        name: cargo-fmt
        entry: cargo fmt --check
        language: system
        pass_filenames: false
        files: '^(Cargo\.toml|Cargo\.lock|src/|tests/)'
    -   id: cargo-check
        name: cargo-check
        entry: cargo check
        language: system
        pass_filenames: false
        files: '^(Cargo\.toml|Cargo\.lock|src/|tests/)'
    -   id: cargo-test
        name: cargo-test
        entry: cargo test
        language: system
        pass_filenames: false
        files: '^(Cargo\.toml|Cargo\.lock|src/|tests/)'

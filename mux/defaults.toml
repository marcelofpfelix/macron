# Built-in dashboard layouts. ~/.config/mux/layouts.toml is merged on top,
# so it only needs to contain the values a user wants to override.

[layouts.dash2]
workspace = "dash"
tab = "{target}"
servers = 1
restart = "always"
retry_seconds = 5

[layouts.dash2.environment]
LC_LAYOUT = "dash"
LC_SERVICE = "{service}"

[[layouts.dash2.panes]]
id = "top-1"
environment = { LC_PANE_ROW = "1" }
label = "{target} top 1"
command = "ssh -- {server_1}"

[[layouts.dash2.panes]]
id = "bottom-1"
label = "{target} bottom 1"
from = "top-1"
split = "down"
ratio = 0.5
command = "ssh -- {server_1}"

